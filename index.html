<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wizard Kartenrunde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Grenze+Gotisch:wght@500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Caveat:wght@700&family=Cinzel:wght@700&family=Oswald:wght@600&family=Playfair+Display:wght@700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout-Idee: ein Nachttisch aus indigoblauem Samt, Messing für alles, was dran ist; die Karten tragen die Farbe. */
  --night: #121027;
  --velvet: #1b183d;
  --felt: #262258;
  --line: #3b3680;
  --brass: #d9a441;
  --brass-2: #f2cd72;
  --parch: #f3ead3;
  --ink: #1b1730;
  --mist: #aca8d3;
  --good: #6fd0a2;
  --bad: #f08572;
  --display: 'Grenze Gotisch', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --body: 'Alegreya Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background-color: var(--night);
  color: var(--parch);
  font: 400 17px/1.45 var(--body);
  -webkit-text-size-adjust: 100%;
}
#app { min-height: 100%; display: flex; flex-direction: column; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.1; }
h2 { font-size: 1.5rem; }
h2 small { font: 500 .95rem var(--body); color: var(--mist); margin-left: 6px; }
h3 { font-size: 1.12rem; color: var(--brass-2); margin-top: 16px; margin-bottom: 6px; letter-spacing: .01em; }
p { margin: 0; }
small { color: var(--mist); }
code { font-size: .9em; background: rgba(255, 255, 255, .08); padding: 0 4px; border-radius: 4px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.fine { font-size: .9rem; color: var(--mist); }
.err { color: var(--bad); font-weight: 700; }
.wait { margin: auto; font-family: var(--display); font-size: 1.5rem; color: var(--mist); }
:focus-visible { outline: 2px solid var(--brass-2); outline-offset: 2px; }

/* Bedienelemente */
.btn { font: 700 1rem var(--body); color: var(--parch); background: rgba(255, 255, 255, .07); border: 1px solid var(--line); border-radius: 10px; padding: 9px 15px; cursor: pointer; transition: background .12s, transform .08s; }
.btn:hover:not(:disabled) { background: rgba(255, 255, 255, .13); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: var(--brass); color: var(--ink); border-color: var(--brass-2); }
.btn.primary:hover:not(:disabled) { background: var(--brass-2); }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 11px; font-size: .92rem; }
.btn.big { padding: 13px 28px; font-size: 1.15rem; }
.btn:disabled, .opt:disabled, .rb:disabled, .bb:disabled { opacity: .45; cursor: not-allowed; }
input[type=text], select { font: 500 1rem var(--body); color: var(--parch); background: rgba(8, 6, 24, .55); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; min-width: 0; }
input[type=color] { width: 46px; height: 38px; padding: 2px; background: rgba(8, 6, 24, .55); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
label { font-size: .88rem; color: var(--mist); font-weight: 500; }
.panel { background: rgba(18, 16, 39, .55); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
.tag { font-size: .72rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--mist); white-space: nowrap; }
.tag.gold { border-color: var(--brass); color: var(--brass-2); }
.tag.dim { opacity: .7; }
.chip { font-size: .82rem; font-weight: 700; padding: 2px 10px; border-radius: 99px; background: rgba(255, 255, 255, .08); white-space: nowrap; }
.chip.on { background: rgba(217, 164, 65, .2); color: var(--brass-2); }
.av { --h: 200; flex: none; width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; font: 700 .9rem var(--body); background: hsl(var(--h) 45% 38%); color: #fff; line-height: 1; overflow: hidden; }
.av.emo { font-size: 1.12rem; background: hsl(var(--h) 38% 24%); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .16); }
.av.pic { background-color: var(--line); background-size: cover; background-position: center; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25); }
.av.big { width: 52px; height: 52px; font-size: 1.5rem; }
.av.emo.big { font-size: 1.9rem; }
.namerow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.namerow input { flex: 1 1 180px; max-width: 320px; font-size: 1.1rem; }
.avbtn { all: unset; cursor: pointer; border-radius: 50%; display: grid; }
.avbtn:hover .av, .avbtn:focus-visible .av { outline: 2px solid var(--brass-2); outline-offset: 2px; }
.plist .mine-av { padding: 3px 9px; font-size: .82rem; }
.sheet.mid { max-width: 540px; }
.avgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 6px; }
.avopt { all: unset; cursor: pointer; display: grid; place-items: center; padding: 6px 0; border-radius: 12px; border: 1px solid transparent; }
.avopt:hover { background: rgba(255, 255, 255, .07); }
.avopt.on { border-color: var(--brass); background: rgba(217, 164, 65, .15); }
.avopt:focus-visible { outline: 2px solid var(--brass-2); }
.avown { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding-top: 6px; border-top: 1px solid var(--line); }
.av.none { background: transparent; border: 1px dashed var(--line); }
.nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.banner { background: rgba(240, 133, 114, .16); border-bottom: 1px solid var(--bad); padding: 8px 16px; font-weight: 500; text-align: center; }
#toast { position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 30px); opacity: 0; pointer-events: none; background: var(--parch); color: var(--ink); font-weight: 700; padding: 10px 16px; border-radius: 12px; max-width: min(92vw, 520px); z-index: 40; transition: transform .2s, opacity .2s; box-shadow: 0 8px 24px rgba(0, 0, 0, .5); }
#toast.show { transform: translate(-50%, 0); opacity: 1; }

/* Karten */
.card { --cbg: var(--parch); --cfg: var(--ink); position: relative; display: block; flex: none; width: var(--cw, 72px); aspect-ratio: var(--car, 57 / 89); border-radius: calc(var(--cw, 72px) * .1); background-color: var(--cbg); background-size: cover; background-position: center; color: var(--cfg); font-family: var(--cfont, var(--display)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .28), 0 2px 7px rgba(0, 0, 0, .5); overflow: hidden; user-select: none; -webkit-user-select: none; }
.card::after { content: ""; position: absolute; inset: 5%; border: 1px solid color-mix(in srgb, var(--cfg) 38%, transparent); border-radius: calc(var(--cw, 72px) * .07); pointer-events: none; }
.s-a { --cbg: var(--sa); --cfg: var(--sa-ink); --halo: var(--sa-halo); } .s-b { --cbg: var(--sb); --cfg: var(--sb-ink); --halo: var(--sb-halo); } .s-c { --cbg: var(--sc); --cfg: var(--sc-ink); --halo: var(--sc-halo); } .s-d { --cbg: var(--sd); --cfg: var(--sd-ink); --halo: var(--sd-halo); }
.s-k1 { --cbg: var(--sk1); --cfg: var(--sk1-ink); --halo: var(--sk1-halo); } .s-k2 { --cbg: var(--sk2); --cfg: var(--sk2-ink); --halo: var(--sk2-halo); } .s-k3 { --cbg: var(--sk3); --cfg: var(--sk3-ink); --halo: var(--sk3-halo); } .s-kS { --cbg: var(--skS); --cfg: var(--skS-ink); --halo: var(--skS-halo); }
.s-Z { --cbg: var(--sZ); --cfg: var(--sZ-ink); --halo: var(--sZ-halo); } .s-N { --cbg: var(--sN); --cfg: var(--sN-ink); --halo: var(--sN-halo); }
.cm { position: absolute; inset: 0; display: grid; place-items: center; font-size: calc(var(--cw, 72px) * .62 * var(--cmid, 1)); font-weight: 700; line-height: 1; }
.s-Z .cm, .s-N .cm, .s-kS .cm { padding-bottom: 14%; }
.ci { position: absolute; display: flex; flex-direction: column; align-items: center; line-height: .95; font-size: calc(var(--cw, 72px) * .21 * var(--cidx, 1)); font-weight: 700; }
.ci b { font-weight: 700; }
.ci i { font-style: normal; font-size: .78em; font-family: var(--body); }
.ci.tl { top: 8%; left: 10%; }
.ci.br { bottom: 8%; right: 10%; transform: rotate(180deg); }
.cn { position: absolute; left: 0; right: 0; bottom: 17%; text-align: center; font: 700 calc(var(--cw, 72px) * .13) var(--body); letter-spacing: .06em; text-transform: uppercase; }
.card.img .cn, .card.img::after { display: none; }
.card.img .cm, .card.img .ci { text-shadow: 0 0 .08em var(--halo), 0 0 .2em var(--halo), 0 .03em .12em var(--halo); }
.card.img .cm { padding: 0; }
.card.m0 .cm { display: none; }
.card.back.img { background-size: cover !important; }
.card.h1 .ci { background: var(--cbg); padding: .14em .24em; border-radius: .3em; text-shadow: none; }
.card.img .ci.tl { top: 4%; left: 5%; } .card.img .ci.br { bottom: 4%; right: 5%; }
.card.o0 .ci { display: none; }
.card.back { background-color: var(--bk1); color: var(--bk2); }
.card.back::after { border-color: color-mix(in srgb, var(--bk2) 70%, transparent); }
.card.back .bs { position: absolute; inset: 0; margin: auto; width: 46%; aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; background: var(--bk1); border: 1px solid var(--bk2); font-size: calc(var(--cw, 72px) * .3); line-height: 1; }
.card.back .bs:empty { display: none; }
.pt-rauten { background-image: repeating-linear-gradient(45deg, transparent 0 7px, color-mix(in srgb, var(--bk2) 38%, transparent) 7px 8px), repeating-linear-gradient(-45deg, transparent 0 7px, color-mix(in srgb, var(--bk2) 38%, transparent) 7px 8px); }
.pt-streifen { background-image: repeating-linear-gradient(90deg, transparent 0 6px, color-mix(in srgb, var(--bk2) 38%, transparent) 6px 8px); }
.pt-punkte { background-image: radial-gradient(circle, color-mix(in srgb, var(--bk2) 60%, transparent) 1.2px, transparent 1.6px); background-size: 9px 9px; }
.card.tiny { --cw: 30px; }
.card.tiny .ci, .card.tiny .cn { display: none; }
.card.tiny .cm { padding: 0; }
.card.tiny .cm { display: grid !important; font-size: calc(var(--cw, 72px) * .62); }
.card.slot { background: transparent; border: 1px dashed var(--line); box-shadow: none; }
.card.slot::after { display: none; }

/* Startseite */
.home { flex: 1; width: 100%; max-width: 980px; margin: 0 auto; padding: 28px 20px 40px; display: grid; grid-template-columns: 1fr; gap: 22px; align-content: start; }
.brand { display: grid; grid-template-columns: auto 1fr; column-gap: 28px; align-items: end; }
.fan { --cw: 76px; position: relative; width: 210px; height: 150px; grid-row: span 2; }
.fc { position: absolute; left: 67px; top: 18px; transform-origin: 50% 150%; transform: rotate(calc(var(--i) * 13deg)); animation: fan .7s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes fan { from { transform: rotate(0deg); } }
.brand h1 { font-size: clamp(3.4rem, 11vw, 6rem); letter-spacing: -.01em; color: var(--brass-2); line-height: .9; }
.sub { font-size: 1.2rem; color: var(--mist); max-width: 32ch; }
.start { display: flex; flex-direction: column; gap: 8px; }
.start > input { max-width: 320px; font-size: 1.1rem; }
.startrow { display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: center; margin-top: 8px; }
.joinbox { display: flex; gap: 6px; }
.joinbox input { width: 132px; text-transform: uppercase; letter-spacing: .14em; font-weight: 700; }
.how { max-width: 62ch; color: var(--mist); }
.how h2 { color: var(--parch); margin-bottom: 8px; font-size: 1.3rem; }
.how ol { margin: 0 0 8px; padding-left: 22px; display: grid; gap: 4px; }

/* Lobby */
.lobby { flex: 1; width: 100%; max-width: 1040px; margin: 0 auto; padding: 0 16px 24px; display: flex; flex-direction: column; gap: 16px; }
.lobhead { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: end; padding-top: 18px; }
.eyebrow { display: block; font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--mist); }
.code { font: 700 2.5rem/1.05 var(--body); letter-spacing: .16em; color: var(--brass-2); font-variant-numeric: lining-nums; }
.headbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.lobgrid { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 16px; align-items: start; }
.lobgrid > .panel { min-width: 0; }
.plist { list-style: none; margin: 12px 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.plist li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 6px 8px; border-radius: 10px; background: rgba(255, 255, 255, .05); min-height: 42px; min-width: 0; }
.plist li .nm { flex: 1 1 7ch; }
.plist li .btn { white-space: nowrap; }
.plist li.free { background: transparent; border: 1px dashed var(--line); color: var(--mist); }
.plist li.free .nm { font-weight: 400; }
.plist li.off { opacity: .55; }
.plist .x { margin-left: 0; background: none; border: 0; color: var(--mist); font-size: 1.3rem; line-height: 1; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
.plist .x:hover { color: var(--bad); }
.panel > .btn.small { margin-right: 6px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
.opt { text-align: left; font: inherit; color: inherit; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; width: 100%; }
.opt span { font-size: .9rem; color: var(--mist); line-height: 1.3; }
.opt.on { border-color: var(--brass); background: rgba(217, 164, 65, .13); opacity: 1 !important; }
.opt.on b { color: var(--brass-2); }
.opt.toggle b::before { content: "○ "; }
.opt.toggle.on b::before { content: "● "; }
.roundsrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; margin-bottom: 6px; }
.stepper { cursor: default; }
.steps { display: flex; align-items: center; gap: 10px; }
.steps output { font: 700 1.5rem var(--display); min-width: 2ch; text-align: center; color: var(--parch); font-variant-numeric: tabular-nums; }
.rb { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: rgba(255, 255, 255, .08); color: var(--parch); font: 700 1.2rem var(--body); cursor: pointer; }
.designrow { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.sample { display: flex; gap: 6px; --cw: 46px; }
.designctl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lobfoot { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.lobfoot .ghost { margin-left: auto; }
.waitline { color: var(--mist); font-style: italic; }

/* Spieltisch */
.game { flex: 1; display: flex; flex-direction: column; min-height: 100%; }
.topbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: rgba(18, 16, 39, .6); }
.tb1, .tb3 { display: flex; align-items: center; gap: 8px; }
.rnd { font: 500 1.25rem var(--display); }
.rnd b { font-size: 1.5rem; color: var(--brass-2); }
.trump { display: flex; align-items: center; gap: 8px; }
.tl2 { font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid rgba(255, 255, 255, .5); }
.seats { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 10px 12px 4px; }
.seat { display: flex; flex-direction: column; justify-content: center; gap: 3px; min-width: 150px; max-width: 230px; flex: 1 1 150px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 12px; background: rgba(18, 16, 39, .5); }
.seat.turn, .mebar.turn { border-color: var(--brass); box-shadow: 0 0 0 1px var(--brass), 0 0 20px rgba(217, 164, 65, .3); }
.seat.off { opacity: .55; }
.st { display: flex; align-items: center; gap: 6px; min-width: 0; }
.ss { display: flex; gap: 10px; font-size: .88rem; color: var(--mist); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ss b { color: var(--parch); font-size: 1rem; }
.pts { color: var(--brass-2); font-weight: 700; }
.minis, .seatcard { margin-left: auto; flex: none; padding-left: 4px; }
.minis { display: flex; align-items: center; }
.minis i { width: 13px; height: 19px; border-radius: 3px; background: var(--bk1); border: 1px solid var(--bk2); margin-left: -8px; }
.minis i:first-child { margin-left: 0; }
.minis small { margin-left: 5px; font-weight: 700; }
.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 10px 12px; min-height: 170px; }
.trick { display: flex; gap: 8px; align-items: flex-start; justify-content: center; }
.tc { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.tc.new .card { animation: drop .25s ease-out; }
@keyframes drop { from { transform: translateY(-16px) scale(1.06); opacity: .3; } }
.tc.win .card { outline: 3px solid var(--brass-2); outline-offset: 2px; }
.tc.win .who { color: var(--brass-2); }
.who { font-size: .82rem; font-weight: 700; color: var(--mist); max-width: calc(var(--cw) + 8px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status { text-align: center; font-size: 1.08rem; min-height: 1.5em; }
.status small { display: block; }
.pickbox { text-align: center; display: grid; gap: 10px; max-width: 46ch; }
.picks { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.pick { font: 700 1.05rem var(--body); padding: 10px 16px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, .4); background: var(--cbg); color: var(--cfg); cursor: pointer; }
.mine { padding-bottom: 6px; }
.bidbar { margin: 0 12px 8px; padding: 10px 12px; border: 1px solid var(--brass); border-radius: 14px; background: rgba(217, 164, 65, .1); display: grid; gap: 8px; justify-items: center; text-align: center; }
.bl { font: 700 1.2rem var(--display); }
.bbs { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.bb { min-width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--brass); background: var(--velvet); color: var(--parch); font: 700 1.3rem var(--display); cursor: pointer; font-variant-numeric: tabular-nums; }
.bb:hover:not(:disabled) { background: var(--brass); color: var(--ink); }
.bb:disabled { text-decoration: line-through; border-color: var(--line); }
.mebar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0 12px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 12px; background: rgba(18, 16, 39, .5); }
.mebar .ss { margin-left: auto; }
.blindnote { flex-basis: 100%; }
.mebar.spec { justify-content: space-between; }
.takes { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.hand { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 12px 10px; min-height: calc(var(--cw, 72px) * 1.56 + 28px); }
.hrow { display: flex; justify-content: center; }
.hc { all: unset; display: block; position: relative; cursor: default; border-radius: 8px; transition: transform .12s, filter .12s; }
.hc.ok { cursor: pointer; }
.hc.ok:hover { transform: translateY(-8px); }
.hc.sel { transform: translateY(-16px) !important; }
.hc.sel .card { outline: 3px solid var(--brass-2); }
.hc.no { filter: brightness(.5) saturate(.6); }
.hc:focus-visible .card { outline: 2px solid var(--brass-2); outline-offset: 2px; }

/* Tabellen */
.summary { width: 100%; max-width: 560px; display: grid; gap: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 16px; background: rgba(18, 16, 39, .7); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid rgba(59, 54, 128, .7); white-space: nowrap; }
th:first-child { text-align: left; }
thead th { font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--mist); }
tr.me th { color: var(--brass-2); }
tr.win th, tr.win td { background: rgba(217, 164, 65, .12); }
.pos { color: var(--good); font-weight: 700; } .neg { color: var(--bad); font-weight: 700; }
.sumfoot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
table.score th, table.score td { text-align: center; }
table.score td { line-height: 1.15; }
table.score .bw { display: block; font-size: .82rem; color: var(--mist); }
table.score td b { font-size: 1.05rem; }
table.score td.hit .bw { color: var(--good); } table.score td.miss .bw { color: var(--bad); }
table.score thead th { position: sticky; top: 0; background: var(--velvet); text-transform: none; letter-spacing: 0; font-size: .92rem; color: var(--parch); }

/* Dialoge */

/* Passt nicht!: Gesamt unter dem Namen, Kartenrückseiten mittig im restlichen Platz daneben */
.gm-passt .seat .ss.hasmin > .ssin { flex: none; }
.gm-passt .seat .ss.hasmin > .minis { margin: 0 auto; }
.cblay { font-size: .75rem; padding: 2px 8px; }
.topbar.tbc .cblay { display: inline-flex; }
@media (max-width: 600px) {
  .gm-cabo.cbcol .seats > .seat { flex: 1 1 100% !important; max-width: 100% !important; }
  .gm-cabo.cbcol .seat .cbrow { flex-wrap: nowrap; justify-content: space-between; }
}
.nm .dg { font-size: 1.12em; line-height: 1; }
/* Zuschneide-Editor: Werkzeuge und Vorschau in Spielgröße */
.crtools { flex-wrap: wrap; gap: 6px; }
.crtools .btn.on { border-color: var(--brass); color: var(--brass-2); }
.crpv { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
.crpv canvas { border-radius: 6px; box-shadow: 0 2px 8px rgba(0, 0, 0, .4); }
#crop-orig { touch-action: none; user-select: none; }
/* Leistungsmodus: teure Effekte aus */
body.lite *, body.lite *::before, body.lite *::after { box-shadow: none !important; text-shadow: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
body.lite .card, body.lite .seat, body.lite .mebar { transition: none !important; }
body.lite #bg, body.lite .bgfx { display: none !important; }
/* Werte zum Eintippen */
.steps output, .crrow output { cursor: text; border-bottom: 1px dotted var(--line); }
input.numin { font: inherit; font-weight: 700; text-align: center; padding: 1px 4px; border-radius: 6px; border: 1px solid var(--brass); background: rgba(0, 0, 0, .25); color: var(--parch); min-width: 3ch; }
/* Editor: Reiter „Aussehen“ */
.edgrp { grid-column: 1 / -1; border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px; margin: 4px 0 10px; }
.edgrp > summary { cursor: pointer; font-weight: 700; color: var(--brass-2); padding: 6px 0; }
.edgrp .edgrpin { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 4px 22px; }
.edgrp .edgrpin section { min-width: 0; }

.crhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.crhead h2{margin-right:auto}
.crheadb{display:flex;gap:6px;flex-wrap:wrap}
.grid60.rowsN { gap: 5px; }
.grid60.rowsN .gc { min-width: 0; }
.grid60 .gpad { visibility: hidden; pointer-events: none; }
.edpbox { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px; background: var(--felt); border: 1px solid var(--line); border-radius: 12px; }
.edpbox .edprev { margin-left: auto; padding: 0; background: none; border: 0; border-radius: 0; max-width: 100%; }
.edinfo { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; min-width: 0; }
.edinfo .ednm { margin: 0; }
.edinfo .ednm input { width: 14em; max-width: 60vw; }
.pcols .pcol{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);padding:0;cursor:pointer}
.pcols .pcol.on{outline:2px solid var(--gold,#f2cd72);outline-offset:2px}
.pcols input[type=color]{width:30px;height:24px;padding:0;border:0;background:none}
.card.img { background-color: transparent !important; }
/* Karte mit eigenem Bild und farbigem Rand: Rand liegt UM das Bild statt darüber – der ganze Zuschnitt bleibt sichtbar */
.card.img.r1:not(.back) { box-sizing: border-box; padding: max(3px, calc(var(--cw, 72px) * .06)); background-origin: content-box !important; background-clip: content-box !important; }
.edbr { display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: flex-start; grid-column: 1 / -1; }
.edbr > section { flex: 1 1 260px; min-width: 0; }
/* Editor-Raster: Karte füllt die Zelle – Rundung, Schrift und Symbole an der echten Kartenbreite ausrichten */
.grid60 .gc { container-type: inline-size; }
.grid60 .gc > .card { --cw: 100cqw; }
